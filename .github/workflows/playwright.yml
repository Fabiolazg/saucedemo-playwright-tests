
name: Testes Automatizados - SauceDemo

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  testes-funcionais:
    name: Testes Funcionais - Playwright
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar navegadores
        run: npx playwright install --with-deps

      - name: Executar testes funcionais
        run: |
          npx playwright test \
            tests/auth.spec.ts \
            tests/products.spec.ts \
            tests/cart.spec.ts \
            tests/checkout.spec.ts \
            tests/session.spec.ts

      - name: Publicar relatório HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-playwright
          path: playwright-report/
          retention-days: 30